<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng Ký Tài Khoản - ShopVN</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
        .form-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 400px; }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input[type="text"], input[type="password"], input[type="email"], input[type="tel"], input[type="date"] {
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
        }
        .radio-group { margin-top: 5px; }
        .btn { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        .btn-login { background-color: #007bff; margin-top: 10px; text-align: center; display: block; text-decoration: none; padding: 10px; color: white; border-radius: 4px;}
        .required { color: red; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>ShopVN - Đăng Ký</h2>
    <form id="registerForm">
        <div class="form-group">
            <label>Họ và tên <span class="required">(*)</span></label>
            <input type="text" id="fullname" required>
        </div>
        <div class="form-group">
            <label>Tên đăng nhập <span class="required">(*)</span></label>
            <input type="text" id="username" required>
        </div>
        <div class="form-group">
            <label>Email <span class="required">(*)</span></label>
            <input type="email" id="email" required>
        </div>
        <div class="form-group">
            <label>Số điện thoại <span class="required">(*)</span></label>
            <input type="tel" id="phone" required>
        </div>
        <div class="form-group">
            <label>Mật khẩu <span class="required">(*)</span></label>
            <input type="password" id="password" required>
        </div>
        <div class="form-group">
            <label>Xác nhận mật khẩu <span class="required">(*)</span></label>
            <input type="password" id="confirm_password" required>
        </div>
        <div class="form-group">
            <label>Ngày sinh</label>
            <input type="date" id="dob">
        </div>
        <div class="form-group">
            <label>Giới tính</label>
            <div class="radio-group">
                <input type="radio" name="gender" value="Nam"> Nam
                <input type="radio" name="gender" value="Nữ"> Nữ
                <input type="radio" name="gender" value="Khác"> Không muốn tiết lộ
            </div>
        </div>
        <div class="form-group">
            <label>Mã giới thiệu</label>
            <input type="text" id="ref_code">
        </div>
        <div class="form-group">
            <input type="checkbox" id="terms" required>
            <label for="terms" style="display:inline; font-weight: normal;">
                Tôi đồng ý với <a href="#" id="termLink">Điều khoản</a> <span class="required">(*)</span>
            </label>
        </div>

        <button type="submit" class="btn" id="btnRegister">Đăng ký</button>
        <a href="#" class="btn-login">Đăng nhập</a>
    </form>
</div>

</body>
</html>
